  frigate:
  - annotations:
      artifacthub.io/changes: |
        - "[Changed] Forked from blakeblackshear/blakeshome-charts (unmaintained since 2025-11), to be maintained and improved here going forward"
        - "[Fixed] go2rtc admin service port (1984) was routed to the wrong container port (webrtc-tcp instead of go2rtc-admin)"
        - "[Fixed] liveness/readiness/startup probes hit the full web UI (/) instead of a lightweight endpoint (/api/)"
        - "[Fixed] resources.limits.nvidia.com/gpu was rendered as a YAML int instead of the string Kubernetes' Quantity type expects"
        - "[Fixed] RSTP typos (frigate-rstp-credentials, FRIGATE_RSTP_USERNAME) corrected to RTSP"
        - "[Fixed] stale amd64nvidia/Docker-Hub image tagging guidance replaced with current GHCR-based tagging"
        - "[Changed] Bumped default appVersion to 0.17.2 (was stuck on 0.14.1)"
        - "[Added] Configurable ingress pathType per host path (was hardcoded to ImplementationSpecific)"
        - "[Added] Gateway API HTTPRoute support as an alternative to Ingress"
        - "[Added] priorityClassName support"
        - "[Added] Optional dnsConfig passthrough"
        - "[Added] config accepts a native YAML map in addition to a string"
        - "[Added] persistence.config.seedOnly to seed config.yml once and let Frigate's UI own it afterward, instead of always overwriting it from the ConfigMap"
      artifacthub.io/images: |
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate
      artifacthub.io/links: |
        - name: Frigate source repo
          url: https://github.com/blakeblackshear/frigate
        - name: Upstream chart (blakeshome-charts)
          url: https://github.com/blakeblackshear/blakeshome-charts
        - name: Helm Repo
          url: https://github.com/newbenji/charts
