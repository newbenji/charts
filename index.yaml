  home-assistant:
  - annotations:
      artifacthub.io/changes: |
        - "[Changed] Bumped default appVersion to 2026.8.0"
        - "[Added] Optional whisper (speech-to-text) and piper (text-to-speech) Wyoming services, disabled by default"
        - "[Changed] Cleaned up the ingress template to the current Helm standard and added Gateway API httpRoute support as an alternative"
        - "[Fixed] vscode sidecar: fixed the default port (was 80, unusable by the non-root code-server user), wired up the password and resources values that templates already referenced but values.yaml never defined, and removed the vscode.ingress/vscode.service.* fields that had no template backing them"
        - "[Changed] Bumped default code-server image to 4.131.0"
        - "[Added] extraContainerPorts to open additional ports (optionally a contiguous range) on the Home Assistant container"
        - "[Added] extraManifests to render arbitrary additional Kubernetes manifests alongside the chart (e.g. an ExternalSecret)"
        - "[Added] Optional zigbee2mqtt service, bridging a Zigbee network (USB or network-attached coordinator) to MQTT, with its own PVC and a choice of Ingress or Gateway API HTTPRoute, disabled by default"
        - "[Fixed] zigbee2mqtt Ingress/HTTPRoute rendered regardless of zigbee2mqtt.enabled - disabling the addon left them pointed at a deleted Service instead of being removed too"
        - "[Added] Optional matterServer sidecar (matterjs-server, successor to the archived python-matter-server) running in the same pod as Home Assistant to share its host network for Matter/Thread mDNS discovery, with its own PVC for fabric data, disabled by default"
      artifacthub.io/images: |
        - name: home-assistant
          image: homeassistant/home-assistant
      artifacthub.io/links: |
        - name: Home assistant source repo
          url: https://github.com/home-assistant
        - name: Helm Repo
          url: https://github.com/newbenji/charts
