name: Build and publish helm charts
run-name: ${{ github.actor }} is building charts 🚀

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  packages: write

concurrency:
  # PR-open activity (opened/synchronize/reopened) and the merge/release event
  # share a ref but must not share a cancellation group - otherwise merging
  # right after opening/pushing can cancel the still-running docs job mid-checkout.
  group: build-charts-${{ github.ref }}-${{ (github.event_name == 'pull_request' && github.event.action == 'closed') && 'release' || 'build' }}
  cancel-in-progress: true

env:
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  detect-changed-folders:
    if: github.event_name == 'push' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.get_changed_dirs.outputs.all_changed_and_modified_files }}
      has_changes: ${{ steps.get_changed_dirs.outputs.any_changed }}
    steps:
      - name: Install dependencies
        uses: ConorMacBride/install-package@v1.1.0
        with:
          apt: git

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine base SHA
        id: base-sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed chart directories
        id: get_changed_dirs
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          files: charts/**
          base_sha: "${{ steps.base-sha.outputs.sha }}"
          dir_names_max_depth: 2
          dir_names: true

  validate-charts:
    needs: [detect-changed-folders]
    if: needs.detect-changed-folders.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.detect-changed-folders.outputs.folders) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate chart directory exists
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          if [[ ! -f "Chart.yaml" ]]; then
            echo "❌ Error: Chart.yaml not found in ${{ matrix.chart_path }}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.3

      - name: Helm dependency update
        working-directory: ${{ matrix.chart_path }}
        run: helm dependency update

      - name: Lint Helm chart
        working-directory: ${{ matrix.chart_path }}
        run: |
          if [[ -f "values-lint.yaml" ]]; then
            helm lint -f values.yaml -f values-lint.yaml . --with-subcharts
          else
            helm lint -f values.yaml . --with-subcharts
          fi

  # Docs are regenerated while the PR is still open, pushing to the PR's own
  # branch (unprotected) instead of main. By merge time README.md is already
  # current, so the release job below never needs to push to main at all.
  update-docs:
    needs: [detect-changed-folders, validate-charts]
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      needs.detect-changed-folders.outputs.has_changes == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # chart-search-root is the repo root (not the individual changed chart)
      # because helm-docs resolves a `./`-prefixed shared template file
      # relative to chart-search-root, not the repo root in general. Running
      # from the root also lets it fall back to its built-in template for any
      # chart with no README.md.gotmpl of its own, so no existence check
      # is needed here.
      - name: helm-docs
        uses: losisin/helm-docs-github-action@v2
        with:
          chart-search-root: .
          output-file: README.md
          template-files: ./_templates.gotmpl,README.md.gotmpl
          git-push: true
          fail-on-diff: false

  build-and-publish:
    needs: [detect-changed-folders, validate-charts]
    if: >
      needs.detect-changed-folders.outputs.has_changes == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.detect-changed-folders.outputs.folders) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.3

      - name: Install dependencies
        uses: ConorMacBride/install-package@v1.1.0
        with:
          apt: git curl

      - name: Helm dependency build
        working-directory: ${{ matrix.chart_path }}
        run: helm dependency build

      # Alpha builds happen on every push to a non-main branch. Real releases
      # happen once, when a PR merges into main, so the version in Chart.yaml
      # (bumped by hand in the PR) is used as-is.
      - name: Set alpha version
        if: github.event_name == 'push'
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          CURRENT_VERSION=$(yq e '.version' Chart.yaml)
          ALPHA_VERSION="${CURRENT_VERSION}-alpha"
          yq -i ".version = \"${ALPHA_VERSION}\"" Chart.yaml
          yq -i '(.annotations | select(. != null) | .["artifacthub.io/prerelease"]) |= "true"' Chart.yaml
          echo "Updated version to: ${ALPHA_VERSION}"

      - name: Package chart
        id: package
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          helm package .
          CHART_NAME=$(yq e '.name' Chart.yaml)
          CHART_VERSION=$(yq e '.version' Chart.yaml)
          echo "package_file=${CHART_NAME}-${CHART_VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "chart_name=${CHART_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.package_file }}" "oci://${{ env.CHART_REGISTRY }}"

      # Once the real version is published, its -alpha counterpart (if any)
      # is superseded and just clutters the registry. GITHUB_TOKEN can't
      # delete packages, so this uses a PAT with delete:packages instead.
      - name: Delete superseded alpha package
        if: github.event.pull_request.merged == true
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          set -e
          CHART_NAME="${{ steps.package.outputs.chart_name }}"
          ALPHA_TAG="${{ steps.package.outputs.chart_version }}-alpha"
          PACKAGE_NAME="charts%2F${CHART_NAME}"

          VERSION_ID=$(gh api "/user/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            --jq ".[] | select(.metadata.container.tags[]? == \"${ALPHA_TAG}\") | .id" | head -1)

          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
            echo "Deleted superseded alpha package: ${CHART_NAME}:${ALPHA_TAG} (version id ${VERSION_ID})"
          else
            echo "No superseded alpha package found for ${CHART_NAME}:${ALPHA_TAG}"
          fi

      - name: Job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 📦 ${{ steps.package.outputs.chart_name }} @ ${{ steps.package.outputs.chart_version }}

          | Item | Value |
          |------|-------|
          | Package | \`${{ steps.package.outputs.package_file }}\` |
          | Pushed to | \`oci://${{ env.CHART_REGISTRY }}/${{ steps.package.outputs.chart_name }}\` |
          | Branch | ${{ github.ref_name }} |
          | Commit | ${{ github.sha }} |

          Pull it with:
          \`\`\`
          helm pull oci://${{ env.CHART_REGISTRY }}/${{ steps.package.outputs.chart_name }} --version ${{ steps.package.outputs.chart_version }}
          \`\`\`
          EOF

  # Second publish target for real releases only: packages every chart under
  # charts/, creates a GitHub Release with the .tgz per chart+version, and
  # publishes/updates index.yaml on the gh-pages branch. This is what makes
  # `helm repo add` work, alongside the OCI push above. Idempotent — skips
  # any chart+version that already has a release.
  release-to-pages:
    needs: [detect-changed-folders, build-and-publish]
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.3

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # chart-releaser expects gh-pages to already exist - it doesn't create
      # it. Bootstrap it as an empty branch on first run only.
      - name: Ensure gh-pages branch exists
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "Creating empty gh-pages branch"
            git checkout --orphan gh-pages
            git rm -rf . > /dev/null 2>&1 || true
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "${GITHUB_SHA}"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
