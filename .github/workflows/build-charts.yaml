name: Build and publish helm charts
run-name: ${{ github.actor }} is building charts 🚀

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  packages: write

concurrency:
  group: build-charts-${{ github.ref }}
  cancel-in-progress: true

env:
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  detect-changed-folders:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: encodify-runner
    outputs:
      folders: ${{ steps.get_changed_dirs.outputs.all_changed_and_modified_files }}
      has_changes: ${{ steps.get_changed_dirs.outputs.any_changed }}
    steps:
      - name: Install dependencies
        uses: ConorMacBride/install-package@v1.1.0
        with:
          apt: git

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine base SHA
        id: base-sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed chart directories
        id: get_changed_dirs
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          files: charts/**
          base_sha: "${{ steps.base-sha.outputs.sha }}"
          dir_names_max_depth: 2
          dir_names: true

  validate-charts:
    needs: [detect-changed-folders]
    if: needs.detect-changed-folders.outputs.has_changes == 'true'
    runs-on: encodify-runner
    permissions:
      contents: read
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.detect-changed-folders.outputs.folders) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate chart directory exists
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          if [[ ! -f "Chart.yaml" ]]; then
            echo "❌ Error: Chart.yaml not found in ${{ matrix.chart_path }}"
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.3

      - name: Setup YQ
        uses: chrisdickinson/setup-yq@v1.0.1
        with:
          yq-version: v4.35.2

      - name: Helm dependency update
        working-directory: ${{ matrix.chart_path }}
        run: helm dependency update

      - name: Lint Helm chart
        working-directory: ${{ matrix.chart_path }}
        run: |
          if [[ -f "values-lint.yaml" ]]; then
            helm lint -f values.yaml -f values-lint.yaml . --with-subcharts
          else
            helm lint -f values.yaml . --with-subcharts
          fi

  build-and-publish:
    needs: [detect-changed-folders, validate-charts]
    runs-on: encodify-runner
    permissions:
      contents: write
      packages: write
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.detect-changed-folders.outputs.folders) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.13.3

      - name: Install dependencies
        uses: ConorMacBride/install-package@v1.1.0
        with:
          apt: git curl

      - name: Setup YQ
        uses: chrisdickinson/setup-yq@v1.0.1
        with:
          yq-version: v4.35.2

      - name: Helm dependency build
        working-directory: ${{ matrix.chart_path }}
        run: helm dependency build

      # Alpha builds happen on every push to a non-main branch. Real releases
      # happen once, when a PR merges into main, so the version in Chart.yaml
      # (bumped by hand in the PR) is used as-is.
      - name: Set alpha version
        if: github.event_name == 'push'
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          CURRENT_VERSION=$(yq e '.version' Chart.yaml)
          ALPHA_VERSION="${CURRENT_VERSION}-alpha"
          yq -i ".version = \"${ALPHA_VERSION}\"" Chart.yaml
          yq -i '(.annotations | select(. != null) | .["artifacthub.io/prerelease"]) |= "true"' Chart.yaml
          echo "Updated version to: ${ALPHA_VERSION}"

      - name: Check for README template
        id: check_files
        uses: andstor/file-existence-action@v3
        with:
          files: "${{ matrix.chart_path }}/README.md.gotmpl"

      # Only regenerate docs on the main-release path: parallel matrix entries
      # each committing+pushing README changes to the same branch would race
      # each other on alpha builds across many branches.
      - name: helm-docs
        uses: losisin/helm-docs-github-action@v2
        if: steps.check_files.outputs.files_exists == 'true' && github.event_name == 'pull_request'
        with:
          chart-search-root: ${{ matrix.chart_path }}
          output-file: README.md
          git-push: true
          fail-on-diff: false

      - name: Package chart
        id: package
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          helm package .
          CHART_NAME=$(yq e '.name' Chart.yaml)
          CHART_VERSION=$(yq e '.version' Chart.yaml)
          echo "package_file=${CHART_NAME}-${CHART_VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "chart_name=${CHART_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "${{ steps.package.outputs.package_file }}" "oci://${{ env.CHART_REGISTRY }}"

      - name: Job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Chart Build Summary

          | Item | Value |
          |------|-------|
          | Chart | ${{ steps.package.outputs.chart_name }} |
          | Version | ${{ steps.package.outputs.chart_version }} |
          | Registry | oci://${{ env.CHART_REGISTRY }}/${{ steps.package.outputs.chart_name }} |
          | Branch | ${{ github.ref_name }} |
          | Commit | ${{ github.sha }} |
          EOF
