name: Build and publish helm charts
run-name: ${{ github.actor }} is building charts 🚀

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  # Fallback for when a merged PR doesn't trigger the closed event above.
  # The known cause was the docs commit below carrying `[skip ci]`: GitHub
  # skips pull_request runs (including `closed`) when the PR's head commit
  # says so, so merges whose last commit was the README regeneration never
  # released. Fixed by dropping `[skip ci]`; kept as a manual escape hatch.
  # Manually packages+publishes Chart.yaml's current version from main as-is,
  # same as a normal merge release would.
  workflow_dispatch:
    inputs:
      chart_path:
        description: "Chart directory to release, e.g. charts/home-assistant"
        required: true
        type: string

# Read-only by default; jobs that publish or push ask for more themselves.
permissions:
  contents: read

concurrency:
  # One group per PR (or per branch for pushes), split into build and
  # release so merging right after a push can't cancel the release.
  # Keyed on the PR number, not github.ref: for a closed PR github.ref is
  # the base branch, so every merge's release used to share one group and a
  # second merge cancelled the first one's release. Releases are never
  # cancelled; superseded builds are.
  group: build-charts-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && github.event.action == 'closed') && 'release' || 'build' }}
  cancel-in-progress: ${{ !(github.event_name == 'pull_request' && github.event.action == 'closed') }}

env:
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  detect-changed-folders:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.manual-dispatch.outputs.folders || steps.get_changed_dirs.outputs.all_changed_and_modified_files }}
      has_changes: ${{ steps.manual-dispatch.outputs.has_changes || steps.get_changed_dirs.outputs.any_changed }}
    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Determine base SHA
        if: github.event_name != 'workflow_dispatch'
        id: base-sha
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect changed chart directories
        if: github.event_name != 'workflow_dispatch'
        id: get_changed_dirs
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          matrix: true
          files: charts/**
          # README-only changes (e.g. a docs commit that missed its PR, see
          # regenerate-docs) don't need a build or a re-release.
          files_ignore: charts/**/README.md
          base_sha: "${{ steps.base-sha.outputs.sha }}"
          dir_names_max_depth: 2
          dir_names: true

      - name: Set manual dispatch target
        if: github.event_name == 'workflow_dispatch'
        id: manual-dispatch
        env:
          CHART_PATH: ${{ inputs.chart_path }}
        run: |
          set -e
          echo "folders=$(jq -cn --arg p "$CHART_PATH" '[$p]')" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  validate-charts:
    needs: [detect-changed-folders]
    if: needs.detect-changed-folders.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.detect-changed-folders.outputs.folders) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate chart directory exists
        working-directory: ${{ matrix.chart_path }}
        env:
          CHART_PATH: ${{ matrix.chart_path }}
        run: |
          set -e
          if [[ ! -f "Chart.yaml" ]]; then
            echo "❌ Error: Chart.yaml not found in ${CHART_PATH}"
            exit 1
          fi

      # Artifact Hub scans the images listed here for vulnerabilities; an
      # untagged image makes it scan :latest (or fail, if there is none),
      # not what the chart deploys. Requiring one tag to equal appVersion
      # catches an appVersion bump that forgets the annotation.
      - name: Check artifacthub.io/images annotation
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          app_version=$(yq e '.appVersion' Chart.yaml)
          images=$(yq e '.annotations["artifacthub.io/images"] // ""' Chart.yaml | yq e '.[].image' -)
          [ -z "$images" ] && { echo "No artifacthub.io/images annotation - skipping"; exit 0; }
          matched=false
          for image in $images; do
            tag="${image##*/}"
            if [[ "$tag" != *:* ]]; then
              echo "❌ $image has no tag - Artifact Hub would scan :latest"
              exit 1
            fi
            [[ "${tag#*:}" == "$app_version" ]] && matched=true
          done
          if [[ "$matched" != true ]]; then
            echo "❌ No image in artifacthub.io/images is tagged with appVersion $app_version"
            exit 1
          fi
          echo "✅ artifacthub.io/images tagged, matches appVersion $app_version"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.13.3

      - name: Helm dependency update
        working-directory: ${{ matrix.chart_path }}
        run: helm dependency update

      - name: Lint Helm chart
        working-directory: ${{ matrix.chart_path }}
        run: |
          if [[ -f "values-lint.yaml" ]]; then
            helm lint -f values.yaml -f values-lint.yaml . --with-subcharts
          else
            helm lint -f values.yaml . --with-subcharts
          fi

      # Charts opt in to unit tests by shipping helm-unittest suites under
      # tests/ (excluded from the package via .helmignore).
      - name: Unit test Helm chart
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          if compgen -G "tests/*_test.yaml" > /dev/null; then
            # Run from the upstream image rather than as a plugin: current
            # helm-unittest releases need a newer helm than the one above.
            # Run as the runner user so it can write into the checkout.
            docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/apps" helmunittest/helm-unittest:4.3.0-1.2.1@sha256:28ea86c3e0b07f501f0c2e9c08b9f41e240f4a4b571cb5106b36cf0f0607e989 .
          else
            echo "No tests/*_test.yaml suites - skipping"
          fi

  # Docs are regenerated on the feature branch itself, on every push (a
  # feature branch has no ruleset, so - unlike main - GITHUB_TOKEN can just
  # push straight to it). By the time a PR is opened or merged, the README is
  # already correct and part of the same diff - no separate post-merge PR
  # needed. The commit doesn't retrigger this workflow: it's pushed with
  # GITHUB_TOKEN, and pushes made with GITHUB_TOKEN never start new workflow
  # runs. Don't add `[skip ci]` to the message: when this commit ends up as
  # a PR's head, GitHub then skips the PR's pull_request runs too, i.e. the
  # PR checks and, on merge, the release.
  #
  # This only works for branches pushed to this repo directly - a fork PR's
  # GITHUB_TOKEN is read-only here, so it can't push back to the fork. See
  # check-docs below for the fork case.
  regenerate-docs:
    needs: [detect-changed-folders, validate-charts]
    if: github.event_name == 'push' && needs.detect-changed-folders.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # chart-search-root is the repo root (not the individual changed chart)
      # because helm-docs resolves a `./`-prefixed shared template file
      # relative to chart-search-root, not the repo root in general. Running
      # from the root also lets it fall back to its built-in template for any
      # chart with no README.md.gotmpl of its own, so no existence check
      # is needed here.
      - name: helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: .
          output-file: README.md
          template-files: ./_templates.gotmpl,README.md.gotmpl
          git-push: false
          fail-on-diff: false

      # If the PR was merged while this job ran, GitHub has already deleted
      # the branch, and pushing would recreate it with a docs commit that
      # never reaches main. Skip instead; main's README catches up on the
      # chart's next change.
      - name: Check branch still exists
        id: branch
        run: |
          if git ls-remote --exit-code --heads origin "$GITHUB_REF_NAME" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Branch $GITHUB_REF_NAME is gone (merged and deleted?) - not pushing docs"
          fi

      - name: Commit regenerated docs
        if: steps.branch.outputs.exists == 'true'
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "docs: regenerate chart READMEs"
          file_pattern: "charts/**/README.md"
          # Author the commit as the bot rather than the default (whoever
          # triggered the run). Besides being accurate, the bot only counts
          # as a previous contributor - and so skips the fork-PR approval
          # gate for the PR run this push starts - once a commit it
          # authored has been merged.
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

  # Safety net for pull requests from forks: regenerate-docs above can't push
  # back to a fork, so this just fails the check instead, flagging a stale
  # README on the PR. It doesn't block merging - the main ruleset has no
  # required-status-check rule - but it's visible to a reviewer.
  #
  # Skipped for branches in this repo: regenerate-docs fixes those itself,
  # and a PR opened before that push lands would otherwise check the stale
  # README and stay red. The docs commit does start a new PR run (actor
  # github-actions[bot]); it only runs without manual approval because the
  # repo's fork-PR approval policy is "first-time contributors", which the
  # bot isn't - "all outside contributors" would leave it waiting.
  check-docs:
    needs: [detect-changed-folders, validate-charts]
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      needs.detect-changed-folders.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: helm-docs
        uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
        with:
          chart-search-root: .
          output-file: README.md
          template-files: ./_templates.gotmpl,README.md.gotmpl
          git-push: false
          fail-on-diff: true

  build-and-publish:
    needs: [detect-changed-folders, validate-charts]
    if: >
      needs.detect-changed-folders.outputs.has_changes == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart_path: ${{ fromJSON(needs.detect-changed-folders.outputs.folders) }}
      fail-fast: false
    steps:
      # On merge, use main's tip (the merge commit) rather than the
      # triggering event sha. On a plain push (alpha build), stick with the
      # sha that was actually pushed.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.13.3

      - name: Helm dependency build
        working-directory: ${{ matrix.chart_path }}
        run: helm dependency build

      # Alpha builds happen on every push to a non-main branch. Real releases
      # happen once, when a PR merges into main, so the version in Chart.yaml
      # (bumped by hand in the PR) is used as-is.
      - name: Set alpha version
        if: github.event_name == 'push'
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          CURRENT_VERSION=$(yq e '.version' Chart.yaml)
          ALPHA_VERSION="${CURRENT_VERSION}-alpha"
          yq -i ".version = \"${ALPHA_VERSION}\"" Chart.yaml
          yq -i '(.annotations | select(. != null) | .["artifacthub.io/prerelease"]) |= "true"' Chart.yaml
          echo "Updated version to: ${ALPHA_VERSION}"

      - name: Package chart
        id: package
        working-directory: ${{ matrix.chart_path }}
        run: |
          set -e
          helm package .
          CHART_NAME=$(yq e '.name' Chart.yaml)
          CHART_VERSION=$(yq e '.version' Chart.yaml)
          echo "package_file=${CHART_NAME}-${CHART_VERSION}.tgz" >> "$GITHUB_OUTPUT"
          echo "chart_name=${CHART_NAME}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push chart to GHCR
        working-directory: ${{ matrix.chart_path }}
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
        run: |
          set -e
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push "$PACKAGE_FILE" "oci://${CHART_REGISTRY}"

      # Once the real version is published, its -alpha counterpart (if any)
      # is superseded and just clutters the registry. GITHUB_TOKEN can't
      # delete packages, so this uses a PAT with delete:packages instead.
      - name: Delete superseded alpha package
        if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
          CHART_NAME: ${{ steps.package.outputs.chart_name }}
          CHART_VERSION: ${{ steps.package.outputs.chart_version }}
        run: |
          set -e
          ALPHA_TAG="${CHART_VERSION}-alpha"
          PACKAGE_NAME="charts%2F${CHART_NAME}"

          VERSION_ID=$(gh api "/user/packages/container/${PACKAGE_NAME}/versions?per_page=100" \
            --jq ".[] | select(.metadata.container.tags[]? == \"${ALPHA_TAG}\") | .id" | head -1)

          if [ -n "$VERSION_ID" ]; then
            gh api --method DELETE "/user/packages/container/${PACKAGE_NAME}/versions/${VERSION_ID}"
            echo "Deleted superseded alpha package: ${CHART_NAME}:${ALPHA_TAG} (version id ${VERSION_ID})"
          else
            echo "No superseded alpha package found for ${CHART_NAME}:${ALPHA_TAG}"
          fi

      # Values go in via env, not ${{ }}: they come from Chart.yaml, i.e.
      # from the PR, and must not be spliced into the script as code.
      - name: Job summary
        env:
          CHART_NAME: ${{ steps.package.outputs.chart_name }}
          CHART_VERSION: ${{ steps.package.outputs.chart_version }}
          PACKAGE_FILE: ${{ steps.package.outputs.package_file }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## 📦 ${CHART_NAME} @ ${CHART_VERSION}

          | Item | Value |
          |------|-------|
          | Package | \`${PACKAGE_FILE}\` |
          | Pushed to | \`oci://${CHART_REGISTRY}/${CHART_NAME}\` |
          | Branch | ${GITHUB_REF_NAME} |
          | Commit | ${GITHUB_SHA} |

          Pull it with:
          \`\`\`
          helm pull oci://${CHART_REGISTRY}/${CHART_NAME} --version ${CHART_VERSION}
          \`\`\`
          EOF

  # Second publish target for real releases only: packages every chart under
  # charts/, creates a GitHub Release with the .tgz per chart+version, and
  # publishes/updates index.yaml on the gh-pages branch. This is what makes
  # `helm repo add` work, alongside the OCI push above. Idempotent — skips
  # any chart+version that already has a release.
  release-to-pages:
    needs: [detect-changed-folders, build-and-publish]
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Releases of different PRs now run in parallel, but they all push
    # index.yaml to gh-pages, so serialize just this job. If several queue
    # up, GitHub drops all but the newest pending one - fine, since
    # chart-releaser releases every chart changed since the last release tag.
    concurrency:
      group: release-to-pages
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Normally merged-PR-triggered; also runs on the workflow_dispatch
      # fallback (see the `if` above).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.13.3

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # chart-releaser expects gh-pages to already exist - it doesn't create
      # it. Bootstrap it as an empty branch on first run only.
      - name: Ensure gh-pages branch exists
        run: |
          set -e
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "Creating empty gh-pages branch"
            git checkout --orphan gh-pages
            git rm -rf . > /dev/null 2>&1 || true
            git commit --allow-empty -m "Initialize gh-pages branch"
            git push origin gh-pages
            git checkout "${GITHUB_SHA}"
          fi

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          skip_existing: true
