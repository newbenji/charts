
name: reused
run-name: ${{ github.actor }} is reusing workflow 🚀

on:
  workflow_call:
    inputs:
      config-path:
        required: true
        type: string
    secrets:
      HELM_REPOSITORY_URL:
        required: true


jobs:
  reusable_workflow_job:
    runs-on: ${{ vars.RUNNER }}
    steps:
    - uses: actions/labeler@v4
      with:
        repo-token: ${{ secrets.personal_access_token }}
        configuration-path: ${{ inputs.config-path }}