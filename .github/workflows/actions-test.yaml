name: actions-test
# run-name: ${{ github.actor }} is running actions-test 🚀
run-name: "Action-test: ${{ github.event.head_commit.message }} 🚀"
on:
  push:
    branches-ignore:
      - main

  pull_request_review:
    types: [submitted]

  pull_request:
    branches:
      - main
    types:
      - closed
      - opened


  # schedule:
    # - cron: '* * * *'
# something
jobs:
  call-workflow-passing-data:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    uses: newbenji/charts/.github/workflows/detect-modified-charts.yaml@${{github.head_ref||github.ref_name}}
    with:
      chart-path: charts
      config-path: .github/labeler.yml
      branch: "${{ github.head_ref || github.ref_name }}"
    secrets: inherit

  output-from-detect:
    runs-on:
      group: charts
    needs: call-workflow-passing-data
    steps:
      - run: |
          echo "---------------------------"
          echo ${{ needs.call-workflow-passing-data.outputs.folders }}

  print-hello-opened:
    runs-on:
      group: charts
    if: github.event.pull_request.state == 'opened'
    steps:
      - run: echo "Hello, world, i am an opened pull request "

  print-hello-approved:
    runs-on:
      group: charts
    if: github.event.review.state == 'approved'
    steps:
          - run: echo "Hello, world, i am an approved pull request "


  print-hello-closed:
    runs-on:
      group: charts
    if: github.event.pull_request.state == 'closed' && github.event.pull_request.merged == false
    steps:
          - run: echo "Hello, world, i am an closed pull request but not merged"

  print-hello-merged:
    runs-on:
      group: charts
    if: github.event.pull_request.merged == true
    steps:
      - run: echo "Hello, world, i am an merged closed and merged pull request"

  print-hello-opened-new:
    runs-on:
      group: charts
    if: github.event.created
    steps:
      - run: echo "Hello, world i was pushed"

  print-hello_pushed:
    runs-on:
      group: charts
    if: github.event_name == 'push' && !github.event.created
    steps:
      - run: echo "Hello, world i was pushed"