name: actions-test
on:
  push:
    branches-ignore:
      - main

  pull_request_review:
    types: [submitted]

  create: {}

  pull_request:
    branches:
      - main
    types:
      - closed
      - opened


  # schedule:
    # - cron: '* * * *'
# something
jobs:
  call-workflow-passing-data:
    # runs-on: ${{ vars.RUNNER }}
    # uses: "newbenji/charts/.github/workflows/reused.yaml@${{ github.head_ref || github.ref_name }}"
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    uses: newbenji/charts/.github/workflows/detect-modified-charts.yaml@main

    with:
      config-path: .github/labeler.yml
    secrets: inherit

  output-from-detect:
    runs-on: ${{ vars.RUNNER }}
    needs: call-workflow-passing-data
    steps:
      - run: |
          echo "---------------------------"
          echo ${{ needs.call-workflow-passing-data.outputs.folders }}

  print-hello-opened:
    runs-on: ${{ vars.RUNNER }}
    if: github.event.pull_request.state == 'opened'
    steps:
      - run: echo "Hello, world, i am an opened pull request "

  print-hello-approved:
    runs-on: ${{ vars.RUNNER }}
    if: github.event.review.state == 'approved'
    steps:
          - run: echo "Hello, world, i am an approved pull request "


  print-hello-closed:
    runs-on: ${{ vars.RUNNER }}
    if: github.event.pull_request.state == 'closed'
    steps:
          - run: echo "Hello, world, i am an closed pull request "

  print-hello-merged:
    runs-on: ${{ vars.RUNNER }}
    if: github.event.pull_request.merged == true
    steps:
      - run: echo "Hello, world, i am an merged pull request"

  print-hello-opened-new:
    runs-on: ${{ vars.RUNNER }}
    if: ${{ (github.event.ref_type == 'branch') && github.event.ref != 'main' }}
    steps:
      - run: echo "Hello, world i was pushed"

  print-hello_pushed:
    runs-on: ${{ vars.RUNNER }}
    if: github.event_name == 'push'
    steps:
      - run: echo "Hello, world i was pushed"