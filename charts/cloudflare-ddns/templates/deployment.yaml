{{- include "cloudflare-ddns.validateDomains" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudflare-ddns.fullname" . }}
  labels:
    {{- include "cloudflare-ddns.labels" . | nindent 4 }}
  {{- with (merge (dict) .Values.deploymentAnnotations .Values.commonAnnotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # One updater only: two would race each other on the same records.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "cloudflare-ddns.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudflare-ddns.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if and .Values.cloudflare.apiToken (not .Values.cloudflare.existingSecret.name) }}
        checksum/secret: {{ .Values.cloudflare.apiToken | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cloudflare-ddns
          image: {{ include "cloudflare-ddns.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # The token is read from a file, so it isn't visible in the
            # process environment.
            - name: CLOUDFLARE_API_TOKEN_FILE
              value: /run/secrets/cloudflare/api-token
            {{- with .Values.domains }}
            - name: DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.ip4Domains }}
            - name: IP4_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.ip6Domains }}
            - name: IP6_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: IP4_PROVIDER
              value: {{ .Values.ip4Provider | quote }}
            - name: IP6_PROVIDER
              value: {{ .Values.ip6Provider | quote }}
            - name: UPDATE_CRON
              value: {{ .Values.updateCron | quote }}
            - name: UPDATE_ON_START
              value: {{ .Values.updateOnStart | quote }}
            - name: DELETE_ON_STOP
              value: {{ .Values.deleteOnStop | quote }}
            - name: PROXIED
              value: {{ .Values.proxied | quote }}
            - name: TTL
              value: {{ .Values.ttl | quote }}
            {{- with .Values.recordComment }}
            - name: RECORD_COMMENT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.managedRecordsCommentRegex }}
            - name: MANAGED_RECORDS_COMMENT_REGEX
              value: {{ . | quote }}
            {{- end }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: EMOJI
              value: {{ .Values.emoji | quote }}
            - name: QUIET
              value: {{ .Values.quiet | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: api-token
              mountPath: /run/secrets/cloudflare
              readOnly: true
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: api-token
          secret:
            secretName: {{ include "cloudflare-ddns.tokenSecretName" . }}
            defaultMode: 0440
            items:
              - key: {{ include "cloudflare-ddns.tokenSecretKey" . }}
                path: api-token
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
