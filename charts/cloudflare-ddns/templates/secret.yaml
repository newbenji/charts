{{- if and .Values.cloudflare.apiToken (not .Values.cloudflare.existingSecret.name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudflare-ddns.fullname" . }}
  labels:
    {{- include "cloudflare-ddns.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  api-token: {{ .Values.cloudflare.apiToken | quote }}
{{- end }}
