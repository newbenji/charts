suite: secret
templates:
  - templates/secret.yaml
set:
  domains:
    - example.com
tests:
  - it: stores the token when given inline
    set:
      cloudflare.apiToken: test-token
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: stringData.api-token
          value: test-token

  - it: creates no Secret when an existing one is used
    set:
      cloudflare.existingSecret.name: my-token
    asserts:
      - hasDocuments:
          count: 0
