# Default values for home-assistant.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
strategy: RollingUpdate

image:
  # -- Home Assistant image repository
  repository: homeassistant/home-assistant
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations to add to the Home Assistant pod
podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

homeAssistant:
  persistence:
    # -- Bind the PVC to a specific pre-provisioned PersistentVolume by name. Leave empty to let the cluster's default provisioner handle it.
    volumeName: ""

service:
  # -- Kubernetes Service type used to expose Home Assistant
  type: ClusterIP
  # -- Service port. Also used as the backend port by the ingress and httpRoute
  port: 8123

# -- Additional ports to open on the Home Assistant container, e.g. for integrations that listen on their own port (ESPHome dashboard, Matter, HomeKit Bridge, etc). Set `count` greater than 1 to open a contiguous range starting at containerPort. Port names must stay within Kubernetes' 15-character limit and be unique
extraContainerPorts: []
# - name: esphome
#   containerPort: 6052
# - name: matter
#   containerPort: 5540
#   count: 10
#   protocol: TCP

# -- Enables host networking (so that home assistant can scan devices automatically on the same network). If set to false, you might want to amend dnsPolicy value as well
hostNetwork: true

# -- Dns policy
dnsPolicy: ClusterFirstWithHostNet

ingress:
  # -- Expose Home Assistant via a classic Ingress resource. Mutually exclusive with httpRoute.enabled
  enabled: false
  # -- IngressClass to use, e.g. "nginx". Leave empty to use the cluster's default IngressClass
  className: ""
  # -- Annotations to add to the Ingress, e.g. ingress-controller-specific annotations such as nginx.ingress.kubernetes.io/*
  annotations: {}
  # -- Host/path rules routed to the Home Assistant service
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- TLS configuration for the Ingress
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

httpRoute:
  # -- Expose Home Assistant via a Gateway API HTTPRoute instead of an Ingress. Requires the Gateway API CRDs and a Gateway to already exist in the cluster. Mutually exclusive with ingress.enabled
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Additional labels to add to the HTTPRoute
  labels: {}
  # -- References to the Gateway(s) this route attaches to
  parentRefs:
    - name: ""
      # namespace: gateway-system
      # sectionName: https
  # -- Hostnames the route matches. Leave empty to match all hostnames on the parent Gateway listener(s)
  hostnames: []
  # -- Path matches routed to the Home Assistant service
  matches:
    - path: /
      pathType: PathPrefix

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

persistence:
  # -- StorageClass to request for the Home Assistant config PVC. Leave empty to use the cluster's default StorageClass
  storageClass: ""
  # -- Use an existing PVC instead of creating one. Leave empty to let the chart create it
  existingClaim: ""
  # -- Enable persistence for the Home Assistant config directory
  enabled: true
  # -- Access mode for the Home Assistant config PVC
  accessMode: ReadWriteOnce
  # -- Size of the Home Assistant config PVC
  size: 5Gi
  # -- Additional volumes to add to the Home Assistant pod
  additionalVolumes: []
  # -- Additional volume mounts to add to the Home Assistant container
  additionalMounts: []

vscode:
  # -- Run a code-server (VS Code in the browser) sidecar, in the same pod, for editing the Home Assistant config directory
  enabled: false
  image:
    # -- code-server image repository
    repository: codercom/code-server
    # -- code-server image tag
    tag: 4.131.0
    # -- code-server image pull policy
    pullPolicy: IfNotPresent
  # -- Path to the Home Assistant config directory, mounted into the code-server container
  hassConfig: /config
  # -- Path to code-server's own settings/extensions directory, inside hassConfig
  vscodePath: /config/.vscode
  # -- Additional environment variables for the code-server container
  extraEnv: {}
  # -- Password to require for code-server, stored in a Secret. Leave empty to disable auth (--auth=none) — only safe if the service isn't exposed outside the cluster
  password: ""
  # -- Resource requests/limits for the code-server container
  resources: {}

  service:
    # -- code-server service port, exposed alongside the main Home Assistant port on the same Service. Also used as the container's listen port, so it must be >1024 since the image runs as a non-root user
    port: 8080
    # -- NodePort to request for the code-server port, when service.type (the shared Service's type) is NodePort
    nodePort: ""


whisper:
  # -- Deploy a wyoming-whisper speech-to-text service alongside Home Assistant. Add it in Home Assistant via Settings > Devices & Services > Add Integration > Wyoming Protocol, pointing at the whisper Service on its port
  enabled: false
  image:
    # -- wyoming-whisper image repository
    repository: rhasspy/wyoming-whisper
    # -- wyoming-whisper image tag
    tag: "3.5.0"
    # -- wyoming-whisper image pull policy
    pullPolicy: IfNotPresent
  # -- Whisper model to load. See https://github.com/rhasspy/wyoming-whisper#models
  model: small
  # -- Additional command-line arguments passed to wyoming-whisper
  extraArgs: []
  service:
    # -- Kubernetes Service type used to expose whisper
    type: ClusterIP
    # -- whisper service port
    port: 10300
  persistence:
    # -- Persist the whisper model cache across restarts
    enabled: true
    # -- StorageClass to request for the whisper PVC. Leave empty to use the cluster's default StorageClass
    storageClass: ""
    # -- Use an existing PVC instead of creating one. Leave empty to let the chart create it
    existingClaim: ""
    # -- Access mode for the whisper PVC
    accessMode: ReadWriteOnce
    # -- Size of the whisper PVC
    size: 2Gi
  # -- Resource requests/limits for the whisper container
  resources: {}
  # -- Annotations to add to the whisper pod
  podAnnotations: {}

piper:
  # -- Deploy a wyoming-piper text-to-speech service alongside Home Assistant. Add it in Home Assistant via Settings > Devices & Services > Add Integration > Wyoming Protocol, pointing at the piper Service on its port
  enabled: false
  image:
    # -- wyoming-piper image repository
    repository: rhasspy/wyoming-piper
    # -- wyoming-piper image tag
    tag: "2.3.1"
    # -- wyoming-piper image pull policy
    pullPolicy: IfNotPresent
  # -- Piper voice to load, e.g. en_US-lessac-medium. See https://github.com/rhasspy/piper/blob/master/VOICES.md
  voice: en_US-lessac-medium
  # -- Additional command-line arguments passed to wyoming-piper
  extraArgs: []
  service:
    # -- Kubernetes Service type used to expose piper
    type: ClusterIP
    # -- piper service port
    port: 10200
  persistence:
    # -- Persist the piper voice cache across restarts
    enabled: true
    # -- StorageClass to request for the piper PVC. Leave empty to use the cluster's default StorageClass
    storageClass: ""
    # -- Use an existing PVC instead of creating one. Leave empty to let the chart create it
    existingClaim: ""
    # -- Access mode for the piper PVC
    accessMode: ReadWriteOnce
    # -- Size of the piper PVC
    size: 1Gi
  # -- Resource requests/limits for the piper container
  resources: {}
  # -- Annotations to add to the piper pod
  podAnnotations: {}

zigbee2mqtt:
  # -- Deploy Zigbee2MQTT alongside Home Assistant, bridging a Zigbee network to the MQTT broker configured below. Devices show up in Home Assistant automatically via MQTT discovery, no separate HA-side config needed
  enabled: false
  image:
    # -- zigbee2mqtt image repository
    repository: docker.io/koenkk/zigbee2mqtt
    # -- zigbee2mqtt image tag
    tag: "2.13.0"
    # -- zigbee2mqtt image pull policy
    pullPolicy: IfNotPresent
  # -- Timezone passed to the container, used for log timestamps
  timezone: UTC
  mqtt:
    # -- MQTT broker URL, e.g. mqtt://mosquitto.mosquitto.svc.cluster.local:1883
    server: ""
    # -- MQTT base topic
    baseTopic: zigbee2mqtt
    # -- MQTT username, leave empty if the broker allows anonymous access
    user: ""
    # -- MQTT password, leave empty if the broker allows anonymous access
    password: ""
  serial:
    # -- Zigbee adapter connection string. For a USB dongle this is a /dev/tty* path (see zigbee2mqtt.persistence.device below); for a network-attached coordinator (e.g. SMLIGHT SLZB-* devices) this is a tcp://host:port URL
    port: ""
    # -- Zigbee adapter type: auto, zstack, ember, deconz, zigate, or zboss. See https://www.zigbee2mqtt.io/guide/adapters/
    adapter: auto
    # -- Serial baudrate. Leave empty to use the adapter's default
    baudrate: ""
    # -- Disable the adapter's status LED, if supported
    disableLed: false
  advanced:
    # -- Radio transmit power in dBm, if supported by the adapter. Leave empty for the adapter default
    transmitPower: ""
  # -- Allow new devices to join the Zigbee network. Prefer toggling this from the zigbee2mqtt web UI while pairing instead of leaving it enabled permanently
  permitJoin: false
  # -- Additional environment variables for the zigbee2mqtt container, e.g. further ZIGBEE2MQTT_CONFIG_* overrides. See https://www.zigbee2mqtt.io/guide/configuration/ for the env var naming convention
  extraEnv: {}
  service:
    # -- Kubernetes Service type used to expose the zigbee2mqtt frontend
    type: ClusterIP
    # -- zigbee2mqtt frontend (web UI + API) port
    port: 8080
  persistence:
    # -- Persist the zigbee2mqtt database (network key, paired devices, logs) across restarts. Strongly recommended - losing this means re-pairing every Zigbee device
    enabled: true
    # -- StorageClass to request for the zigbee2mqtt PVC. Leave empty to use the cluster's default StorageClass
    storageClass: ""
    # -- Use an existing PVC instead of creating one. Leave empty to let the chart create it
    existingClaim: ""
    # -- Access mode for the zigbee2mqtt PVC
    accessMode: ReadWriteOnce
    # -- Size of the zigbee2mqtt PVC
    size: 1Gi
  ingress:
    # -- Expose the zigbee2mqtt web UI via a classic Ingress resource. Mutually exclusive with zigbee2mqtt.httpRoute.enabled
    enabled: false
    # -- IngressClass to use, e.g. "nginx". Leave empty to use the cluster's default IngressClass
    className: ""
    # -- Annotations to add to the Ingress
    annotations: {}
    # -- Host/path rules routed to the zigbee2mqtt service
    hosts: []
    # - host: zigbee2mqtt.local
    #   paths:
    #     - path: /
    #       pathType: ImplementationSpecific
    # -- TLS configuration for the Ingress
    tls: []
  httpRoute:
    # -- Expose the zigbee2mqtt web UI via a Gateway API HTTPRoute instead of an Ingress. Requires the Gateway API CRDs and a Gateway to already exist in the cluster. Mutually exclusive with zigbee2mqtt.ingress.enabled
    enabled: false
    # -- Annotations to add to the HTTPRoute
    annotations: {}
    # -- Additional labels to add to the HTTPRoute
    labels: {}
    # -- References to the Gateway(s) this route attaches to
    parentRefs:
      - name: ""
        # namespace: gateway-system
        # sectionName: https
    # -- Hostnames the route matches. Leave empty to match all hostnames on the parent Gateway listener(s)
    hostnames: []
    # -- Path matches routed to the zigbee2mqtt service
    matches:
      - path: /
        pathType: PathPrefix
  # -- Resource requests/limits for the zigbee2mqtt container
  resources: {}
  # -- Annotations to add to the zigbee2mqtt pod
  podAnnotations: {}

matterServer:
  # -- Run matterjs-server (the Open Home Foundation's Matter controller, successor to the archived python-matter-server) as a sidecar in the same pod as Home Assistant - not a separate Deployment, because it needs the pod's host network for Matter/Thread mDNS discovery, and colocating guarantees it stays reachable at a stable localhost address regardless of scheduling. Its data lives in a matter-server/ subdirectory of the Home Assistant config volume (shared safely since it's the same pod, no separate PVC needed). Add it in HA via Settings > Devices & Services > Matter, pointing at ws://localhost:<port>/ws
  # -- IMPORTANT: the image runs as a non-root user (uid 1000). If the Home Assistant container runs as root (the chart's default - see securityContext above), that user can't write to the shared config volume unless you set podSecurityContext.fsGroup: 1000 (or matching whatever uid the image uses) - otherwise this crash-loops on "EACCES: permission denied, mkdir '/data/config'" and, since Kubernetes requires every container in the pod Ready before the pod joins its Service, takes Home Assistant itself offline too even though it isn't the one failing
  enabled: false
  image:
    # -- matterjs-server image repository
    repository: ghcr.io/matter-js/matterjs-server
    # -- matterjs-server image tag
    tag: stable
    # -- matterjs-server image pull policy
    pullPolicy: IfNotPresent
  # -- WebSocket API port
  port: 5580
  # -- Additional command-line arguments, e.g. ["--primary-interface", "eth0"] if host network binds to the wrong interface for mDNS
  extraArgs: []
  # -- Additional environment variables for the matter-server container
  extraEnv: {}
  # -- Security context for the matter-server container. Add capabilities: [NET_RAW] here if you need its device-ping functionality
  securityContext: {}
  # -- Resource requests/limits for the matter-server container
  resources: {}

# -- Recorder database connection string, written into secrets.yaml as `hadbconfig` and referenced by config.recorder's db_url. Must be set to a real connection string.
hadbconfig: ""

config:
  recorder:
    # -- Number of days of history to keep in the recorder database. See https://www.home-assistant.io/integrations/recorder/
    purge_keep_days: 30
  http:
    # -- Trust the X-Forwarded-For header from trusted_proxies. See https://www.home-assistant.io/integrations/http/
    use_x_forwarded_for: false
    # -- CIDR ranges of reverse proxies trusted to set X-Forwarded-For/X-Forwarded-Proto
    trusted_proxies: []
      # - 192.168.0.0/22
      # - 10.42.0.0/24
      # - 10.42.1.0/24
    # -- Ban IPs after too many failed login attempts
    ip_ban_enabled: false
    # -- Number of failed login attempts before an IP is banned
    login_attempts_threshold: 5
  # -- Rendered into configmap-scripts.yaml as Home Assistant's scripts.yaml. See https://www.home-assistant.io/docs/scripts/
  scripts: {}
  # -- Rendered into configmap-automations.yaml as Home Assistant's automations.yaml. See https://www.home-assistant.io/docs/automation/yaml/
  automations: {}
  # -- Rendered into configmap-blueprints.yaml as Home Assistant blueprints. See https://www.home-assistant.io/docs/automation/using_blueprints/
  blueprints: {}
  # -- Rendered into configmap-telegram-bot.yaml as Home Assistant's telegram_bot platform config
  telegram_bot: []
  # -- Rendered into configmap-notify.yaml as Home Assistant's notify platform config
  notify: []

# -- Additional arbitrary Kubernetes manifests to render alongside the chart, e.g. an ExternalSecret or a NetworkPolicy. Each entry is either a map (rendered via toYaml) or a string (rendered as-is); both are passed through tpl, so release/values templating works inside them
extraManifests: []
