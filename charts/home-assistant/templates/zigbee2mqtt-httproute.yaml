{{- if .Values.zigbee2mqtt.httpRoute.enabled -}}
{{- if .Values.zigbee2mqtt.ingress.enabled -}}
{{- fail "zigbee2mqtt.ingress.enabled and zigbee2mqtt.httpRoute.enabled are mutually exclusive; enable only one" -}}
{{- end -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "home-assistant.zigbee2mqttFullname" . }}
  labels:
    {{- include "home-assistant.labelsZigbee2mqtt" . | nindent 4 }}
    {{- with .Values.zigbee2mqtt.httpRoute.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.zigbee2mqtt.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.zigbee2mqtt.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.zigbee2mqtt.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.zigbee2mqtt.httpRoute.matches }}
    - matches:
        - path:
            type: {{ .pathType | default "PathPrefix" }}
            value: {{ .path | default "/" }}
      backendRefs:
        - name: {{ include "home-assistant.zigbee2mqttFullname" $ }}
          port: {{ $.Values.zigbee2mqtt.service.port }}
    {{- end }}
{{- end }}
