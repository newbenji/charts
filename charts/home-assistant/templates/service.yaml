apiVersion: v1
kind: Service
metadata:
  name: {{ include "home-assistant.fullname" . }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- if .Values.vscode.enabled }}
    - name: vscode
      port: {{ .Values.vscode.service.port }}
      protocol: TCP
      targetPort: vscode
      {{ if ( and ( eq .Values.vscode.service.type "NodePort" ) ( not ( empty .Values.vscode.service.nodePort))) }}
      nodePort: {{ .Values.vscode.service.nodePort }}
      {{ end }}
  {{- end }}
  selector:
    {{- include "home-assistant.selectorLabels" . | nindent 4 }}
