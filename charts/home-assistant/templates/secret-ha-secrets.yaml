{{- if and .Values.config.secrets.values (not .Values.config.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "home-assistant.secretsName" . }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.config.secrets.values }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
