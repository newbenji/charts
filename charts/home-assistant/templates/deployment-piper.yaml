{{- if .Values.piper.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-assistant.piperFullname" . }}
  labels:
    {{- include "home-assistant.labelsPiper" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "home-assistant.selectorLabelsPiper" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.piper.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "home-assistant.selectorLabelsPiper" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "home-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      volumes:
        - name: data
          {{- if .Values.piper.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.piper.persistence.existingClaim | default (include "home-assistant.piperFullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      containers:
        - name: wyoming-piper
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.piper.image.repository }}:{{ .Values.piper.image.tag }}"
          imagePullPolicy: {{ .Values.piper.image.pullPolicy }}
          args:
            - --voice
            - {{ .Values.piper.voice | quote }}
            {{- with .Values.piper.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - mountPath: /data
              name: data
          ports:
            # wyoming-piper's entrypoint always binds tcp://0.0.0.0:10200; override via
            # piper.extraArgs (e.g. "--uri", "tcp://0.0.0.0:9999") if you need a different port
            - name: piper
              containerPort: 10200
              protocol: TCP
          resources:
            {{- toYaml .Values.piper.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
