{{- /*
One key per blueprint, named <domain>.<file>; the deployment projects each
domain's keys into /config/blueprints/<domain>/helm/.
*/ -}}
{{- if or .Values.config.blueprints.automation .Values.config.blueprints.script }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-assistant.configName" (list . "blueprints") }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
data:
  {{- range $domain := list "automation" "script" }}
  {{- range $file, $blueprint := index $.Values.config.blueprints $domain }}
  {{ printf "%s.%s" $domain $file }}: |
    {{- include "home-assistant.haYaml" $blueprint | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
