apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "home-assistant.fullname" . }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
    app.kubernetes.io/component: home-assistant
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels:
      {{- include "home-assistant.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "home-assistant.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "home-assistant.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      hostNetwork: {{ .Values.hostNetwork }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      volumes:
        - name: config
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "home-assistant.fullname" .) }}
          {{- else }}
          emptyDir: { }
          {{- end }}
          {{- if .Values.persistence.additionalVolumes }}
            {{- .Values.persistence.additionalVolumes | toYaml | nindent 8}}
          {{- end }}
        - name: recorder
          secret:
            secretName: recorder
        - name: httpconfig
          configMap:
            name: config-http
        - name: config-scripts
          configMap:
            name: config-scripts
        - name: config-telegram-bot
          configMap:
            name: config-telegram-bot
        - name: config-notify
          configMap:
            name: config-notify
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /config
              name: config
            {{- if .Values.persistence.additionalMounts }}
              {{- .Values.persistence.additionalMounts | toYaml | nindent 12 }}
            {{- end }}
            - name: recorder
              mountPath: /config/recorder
              readOnly: true
            - name: httpconfig
              mountPath: /config/http
              readOnly: true
            - name: config-scripts
              mountPath: /config/scripts
              readOnly: true
            - name: config-telegram-bot
              mountPath: /config/telegram_bot.yaml
              subPath: telegram_bot.yaml
              readOnly: true
            - name: config-notify
              mountPath: /config/notify.yaml
              subPath: notify.yaml
              readOnly: true
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
            {{- range .Values.extraContainerPorts }}
            {{- $port := . }}
            {{- $count := $port.count | default 1 | int }}
            {{- $start := $port.containerPort | int }}
            {{- range $i := until $count }}
            - name: {{ if gt $count 1 }}{{ printf "%s-%d" $port.name (add $start $i) }}{{ else }}{{ $port.name }}{{ end }}
              containerPort: {{ add $start $i }}
              protocol: {{ $port.protocol | default "TCP" }}
            {{- end }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.vscode.enabled }}
        - name: vscode
          image: "{{ .Values.vscode.image.repository }}:{{ .Values.vscode.image.tag }}"
          imagePullPolicy: {{ .Values.vscode.image.pullPolicy }}
          workingDir: {{ .Values.vscode.hassConfig }}
          args:
            # - --allow-http
            - --port={{ .Values.vscode.service.port }}
            {{- if not ( .Values.vscode.password ) }}
            - --auth=none
            {{- end }}
            {{- if .Values.vscode.vscodePath }}
            - --extensions-dir={{ .Values.vscode.vscodePath }}
            - --user-data-dir={{ .Values.vscode.vscodePath }}
            {{- end }}
          ports:
            - name: vscode
              containerPort: {{ .Values.vscode.service.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: vscode
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: vscode
            initialDelaySeconds: 15
          env:
            {{- if .Values.vscode.password }}
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ template "home-assistant.fullname" . }}-vscode
                  key: password
            {{- end }}
            {{- range $key, $value := .Values.vscode.extraEnv }}
            - name: {{ $key }}
              value: {{ $value }}
            {{- end }}
          volumeMounts:
            - mountPath: /config
              name: config
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.vscode.resources | nindent 12 }}
        {{- end }}
        {{- if .Values.matterServer.enabled }}
        - name: matter-server
          image: "{{ .Values.matterServer.image.repository }}:{{ .Values.matterServer.image.tag }}"
          imagePullPolicy: {{ .Values.matterServer.image.pullPolicy }}
          args:
            - --storage-path
            - /data
            - --port
            - {{ .Values.matterServer.port | quote }}
            {{- with .Values.matterServer.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- range $key, $value := .Values.matterServer.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: matter
              containerPort: {{ .Values.matterServer.port }}
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: matter
            initialDelaySeconds: 30
          readinessProbe:
            tcpSocket:
              port: matter
            initialDelaySeconds: 15
          volumeMounts:
            - mountPath: /data
              name: config
              subPath: matter-server
          securityContext:
            {{- toYaml .Values.matterServer.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.matterServer.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
