apiVersion: v2
name: home-assistant
description: |
  HomeAssistant is an open source home automation that puts local control and privacy first.
  Powered by a worldwide community of tinkerers and DIY enthusiasts.
  Perfect to run on a Raspberry Pi or a local server..
type: application
version: 0.2.0
appVersion: "2023.11.1"
icon: https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Home_Assistant_Logo.svg/519px-Home_Assistant_Logo.svg.png
keywords:
  - homeassistant
  - home-assistant
  - smart home
annotations:
  artifacthub.io/changes: |
    - "[Removed] Dropped unused postgresql.connection value (contained a stale credential)"
    - "[Fixed] config.blueprints was misspelled as bluepritns and never applied"
    - "[Changed] homeAssistant.persistence.volumeName and hadbconfig now default to empty instead of environment-specific placeholders"
  artifacthub.io/images: |
    - name: home-assistant
      image: homeassistant/home-assistant
  artifacthub.io/links: |
    - name: Home assistant source repo
      url: https://github.com/home-assistant
    - name: Helm Repo
      url: https://github.com/newbenji/charts
