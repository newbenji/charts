apiVersion: v2
name: home-assistant
description: |
  HomeAssistant is an open source home automation that puts local control and privacy first.
  Powered by a worldwide community of tinkerers and DIY enthusiasts.
  Perfect to run on a Raspberry Pi or a local server..
type: application
version: 0.6.0
appVersion: "2026.8.0"
icon: https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/Home_Assistant_Logo.svg/519px-Home_Assistant_Logo.svg.png
keywords:
  - homeassistant
  - home-assistant
  - smart home
annotations:
  artifacthub.io/changes: |
    - "[Changed] Bumped default appVersion to 2026.8.0"
    - "[Added] Optional whisper (speech-to-text) and piper (text-to-speech) Wyoming services, disabled by default"
    - "[Changed] Cleaned up the ingress template to the current Helm standard and added Gateway API httpRoute support as an alternative"
    - "[Fixed] vscode sidecar: fixed the default port (was 80, unusable by the non-root code-server user), wired up the password and resources values that templates already referenced but values.yaml never defined, and removed the vscode.ingress/vscode.service.* fields that had no template backing them"
    - "[Changed] Bumped default code-server image to 4.131.0"
    - "[Added] extraContainerPorts to open additional ports (optionally a contiguous range) on the Home Assistant container"
    - "[Added] extraManifests to render arbitrary additional Kubernetes manifests alongside the chart (e.g. an ExternalSecret)"
    - "[Added] Optional zigbee2mqtt service, bridging a Zigbee network (USB or network-attached coordinator) to MQTT, with its own PVC and a choice of Ingress or Gateway API HTTPRoute, disabled by default"
    - "[Fixed] zigbee2mqtt Ingress/HTTPRoute rendered regardless of zigbee2mqtt.enabled - disabling the addon left them pointed at a deleted Service instead of being removed too"
    - "[Added] Optional matterServer sidecar (matterjs-server, successor to the archived python-matter-server) running in the same pod as Home Assistant to share its host network for Matter/Thread mDNS discovery, with its own PVC for fabric data, disabled by default"
    - "[Changed] matterServer now stores its data in a matter-server/ subdirectory of the shared Home Assistant config volume instead of its own PVC - it's a sidecar in the same pod, so a separate volume isn't needed. Documented that it needs podSecurityContext.fsGroup to match its non-root image user or it crash-loops on EACCES and, since Kubernetes won't ready a pod until every container is, takes Home Assistant itself offline too"
    - "[Fixed] config.automations was rendered under the key scripts.yaml and never mounted - it's now mounted at /config/automations/automations.yaml (not /config/automations.yaml, which HA's UI editor owns), defaulting to an empty list"
    - "[Fixed] config.blueprints was likewise rendered as scripts.yaml and never mounted. It's now config.blueprints.automation / config.blueprints.script, each a map of file name to blueprint, mounted into /config/blueprints/<domain>/helm/"
    - "[Added] Blueprints can be given as YAML strings or as maps; in map form, quoted HA tags (\"!input x\", \"!secret x\") are unquoted again, since Helm drops unquoted custom tags from values"
    - "[Fixed] Changing chart-rendered config (http, recorder, scripts, automations, blueprints, notify) now rolls the pod via a checksum/config annotation - subPath-mounted files never picked up ConfigMap updates before"
    - "[Fixed] The Deployment's labels defined app.kubernetes.io/component twice, which strict YAML parsers reject"
    - "[Deprecated] config.telegram_bot: current Home Assistant rejects YAML setup for telegram_bot. NOTES.txt now warns when it's set"
    - "[Added] config.packages: Home Assistant packages as a map of file name to YAML (string, or map with quoted HA tags), mounted into /config/packages/. One `homeassistant: {packages: !include_dir_named packages}` line in configuration.yaml loads them all"
    - "[Added] config.secrets: mount /config/secrets.yaml from an existing Secret (e.g. ExternalSecrets/SOPS), built from its keys by an initContainer or taken from a single fileKey, or from inline config.secrets.values"
    - "[Changed] Chart-rendered config objects are now prefixed with the release fullname (e.g. recorder -> <release>-home-assistant-recorder, config-http -> <release>-home-assistant-http), so two releases in one namespace no longer collide. Mount paths inside the pod are unchanged, so existing configuration.yaml includes keep working"
  artifacthub.io/images: |
    - name: home-assistant
      image: homeassistant/home-assistant
  artifacthub.io/links: |
    - name: Home assistant source repo
      url: https://github.com/home-assistant
    - name: Helm Repo
      url: https://github.com/newbenji/charts
