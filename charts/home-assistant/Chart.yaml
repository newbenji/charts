apiVersion: v2
name: home-assistant
description: |
  HomeAssistant is an open source home automation that puts local control and privacy first.
  Powered by a worldwide community of tinkerers and DIY enthusiasts.
  Perfect to run on a Raspberry Pi or a local server..
type: application
version: 0.8.0
appVersion: "2026.8.0"
icon: https://brands.home-assistant.io/homeassistant/icon.png
keywords:
  - homeassistant
  - home-assistant
  - smart home
annotations:
  artifacthub.io/changes: |
    - "[Added] macvlan: a Multus + macvlan attachment as an alternative to hostNetwork. The pod gets a second interface directly in a LAN/VLAN for mDNS, SSDP, Cast and Matter/Thread discovery, and eth0 stays a normal pod interface. The chart renders the k8s.v1.cni.cncf.io/networks pod annotation (fixed IPs and MAC) and, by default, its own NetworkAttachmentDefinition <fullname>-macvlan, with the IPv6 router advertisement sysctls that Thread needs"
    - "[Added] matterServer gets --primary-interface <macvlan.interface> when the macvlan attachment is on, unless matterServer.extraArgs sets it"
    - "[Added] The render fails if hostNetwork and macvlan.enabled are both on, or if podAnnotations also sets k8s.v1.cni.cncf.io/networks"
  artifacthub.io/images: |
    - name: home-assistant
      image: homeassistant/home-assistant:2026.8.0
  artifacthub.io/links: |
    - name: Home assistant source repo
      url: https://github.com/home-assistant
    - name: Helm Repo
      url: https://github.com/newbenji/charts
