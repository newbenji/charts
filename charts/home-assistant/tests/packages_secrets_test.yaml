suite: packages and secrets
templates:
  - templates/deployment.yaml
  - templates/configmap-packages.yaml
  - templates/secret-ha-secrets.yaml
  # rendered into checksum/config
  - templates/config-http.yaml
  - templates/recorder.yaml
  - templates/configmap-scripts.yaml
  - templates/configmap-automations.yaml
  - templates/configmap-blueprints.yaml
  - templates/configmap-notify.yaml
  - templates/configmap-telegram-bot.yaml
release:
  name: ha
tests:
  - it: renders no packages, secrets or initContainer by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/configmap-packages.yaml
      - hasDocuments:
          count: 0
        template: templates/secret-ha-secrets.yaml
      - notExists:
          path: spec.template.spec.initContainers
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            mountPath: /config/secrets.yaml
          any: true
        template: templates/deployment.yaml

  - it: renders string and map packages, unquoting HA tags in map form
    set:
      config.packages:
        lights.yaml: |
          # kept
          automation: !include_dir_merge_list automations/
        database.yaml:
          recorder:
            db_url: "!secret hadbconfig"
    template: templates/configmap-packages.yaml
    asserts:
      - equal:
          path: metadata.name
          value: ha-home-assistant-packages
      - equal:
          path: data["lights.yaml"]
          value: |
            # kept
            automation: !include_dir_merge_list automations/
      - matchRegex:
          path: data["database.yaml"]
          pattern: "db_url: !secret hadbconfig"

  - it: rejects package file names HA would silently skip
    set:
      config.packages:
        lights: "automation: []"
    # The deployment's checksum/config renders the packages template first,
    # so that's where the failure surfaces.
    template: templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: must end in .yaml

  - it: mounts packages as a whole directory
    set:
      config.packages:
        a.yaml: "x: 1"
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: packages
            mountPath: /config/packages
            readOnly: true

  - it: builds secrets.yaml from an existing Secret's keys via an initContainer
    set:
      config.secrets.existingSecret: ha-secrets-from-eso
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ha-secrets
            secret:
              secretName: ha-secrets-from-eso
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: render-secrets
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ha-secrets-rendered
            mountPath: /config/secrets.yaml
            subPath: secrets.yaml
            readOnly: true

  - it: mounts one key as the whole secrets.yaml when fileKey is set
    set:
      config.secrets.existingSecret: ha-secrets-from-eso
      config.secrets.fileKey: secrets.yaml
    template: templates/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.initContainers
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ha-secrets
            mountPath: /config/secrets.yaml
            subPath: secrets.yaml
            readOnly: true

  - it: creates a Secret from inline values
    set:
      config.secrets.values:
        hadbconfig: postgresql://ha:pw@db/ha
        port: 1883
    asserts:
      - equal:
          path: metadata.name
          value: ha-home-assistant-secrets
        template: templates/secret-ha-secrets.yaml
      - equal:
          path: stringData.port
          value: "1883"
        template: templates/secret-ha-secrets.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ha-secrets
            secret:
              secretName: ha-home-assistant-secrets
        template: templates/deployment.yaml

  - it: prefers existingSecret over inline values
    set:
      config.secrets.existingSecret: mine
      config.secrets.values:
        a: b
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret-ha-secrets.yaml

  - it: prefixes config objects with the release name
    template: templates/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: recorder
            secret:
              secretName: ha-home-assistant-recorder
      - contains:
          path: spec.template.spec.volumes
          content:
            name: httpconfig
            configMap:
              name: ha-home-assistant-http
