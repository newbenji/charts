# Default values for esphome-device-builder.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Number of replicas to run. The dashboard keeps no shared state between replicas, so anything beyond 1 requires a shared persistence.config volume with a ReadWriteMany access mode
replicaCount: 1

image:
  # -- Docker registry/repository to pull the image from
  repository: ghcr.io/esphome/esphome
  # -- Docker image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the default tag (appVersion) used in Chart.yaml. See available tags at https://github.com/esphome/esphome/pkgs/container/esphome
  tag: ""

# -- Docker image pull secrets
imagePullSecrets: []

# -- Overrides the name of resources
nameOverride: ""
# -- Overrides the Full Name of resources
fullnameOverride: ""

# -- additional ENV variables to set, e.g. ESPHOME_TRUSTED_DOMAINS when running behind an ingress/httpRoute that doesn't forward the original Host header, or ESPHOME_USERNAME (paired with ESPHOME_PASSWORD, normally via envFromSecrets) to enable the dashboard's built-in auth gate. See https://github.com/esphome/device-builder#readme
env: {}
  # ESPHOME_TRUSTED_DOMAINS: esphome.example.com

# -- set environment variables from Secret(s), e.g. for ESPHOME_USERNAME/ESPHOME_PASSWORD
envFromSecrets: []
  # - esphome-dashboard-credentials

serviceAccount:
  # -- Specifies whether a service account should be created
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Set additional pod Annotations
podAnnotations: {}

# -- Set Pod level Security Context. The container level security context defined below will override it
podSecurityContext: {}
  # fsGroup: 2000

# -- Set Container Security Context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Type of Service to use
  type: ClusterIP
  # -- Port the Service should communicate on
  port: 80

ingress:
  # -- Enables the use of an Ingress Controller to front the Service and can provide HTTPS. Mutually exclusive with httpRoute.enabled
  enabled: false
  # -- ingressClassName for using on clusters with multiple ingresses, default is null
  className: ""
  # -- annotations to configure your Ingress. See your Ingress Controller's Docs for more info.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- list of hosts and their paths that the ingress controller should respond to. Each path may also set `pathType` (defaults to `ImplementationSpecific` when unset)
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- list of TLS configurations
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

httpRoute:
  # -- Expose the dashboard via a Gateway API HTTPRoute instead of an Ingress. Requires the Gateway API CRDs and a Gateway to already exist in the cluster. Mutually exclusive with ingress.enabled
  enabled: false
  # -- Annotations to add to the HTTPRoute
  annotations: {}
  # -- Additional labels to add to the HTTPRoute
  labels: {}
  # -- References to the Gateway(s) this route attaches to
  parentRefs:
    - name: ""
      # namespace: gateway-system
      # sectionName: https
  # -- Hostnames the route matches. Leave empty to match all hostnames on the parent Gateway listener(s)
  hostnames: []
  # -- Path matches routed to the dashboard Service
  matches:
    - path: /
      pathType: PathPrefix

persistence:
  config:
    # -- Enables persistence for /config, which holds every device YAML config, secrets, and the dashboard's own state. Without it, all of that is lost whenever the pod restarts. Strongly recommended
    enabled: false
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- size/capacity of the PVC
    size: 1Gi
    # -- access mode to use for the PVC
    accessMode: ReadWriteOnce
    # -- storageClassName for the PVC. Leave empty to use the cluster default
    storageClass: ""
    # -- do not delete the PVC upon helm uninstall
    skipuninstall: false
  cache:
    # -- Enables persistence for /cache (PlatformIO's toolchain/platform downloads), so compiles don't re-download them after every pod restart. Without it, the cache falls back to living under /config instead
    enabled: false
    # -- Use an existing PVC instead of creating one
    existingClaim: ""
    # -- size/capacity of the PVC
    size: 2Gi
    # -- access mode to use for the PVC
    accessMode: ReadWriteOnce
    # -- storageClassName for the PVC. Leave empty to use the cluster default
    storageClass: ""
    # -- do not delete the PVC upon helm uninstall
    skipuninstall: false

# -- Set resource limits/requests for the Pod
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Node Selector configuration
nodeSelector: {}

# -- Node toleration configuration
tolerations: []

# -- Set Pod affinity rules
affinity: {}
