{{- if and .Values.persistence.cache.enabled (not .Values.persistence.cache.existingClaim) }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: {{ include "esphome-device-builder.fullname" . }}-cache
  {{- if .Values.persistence.cache.skipuninstall }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "esphome-device-builder.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.cache.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.cache.size | quote }}
  {{- if .Values.persistence.cache.storageClass }}
  {{- if eq "-" .Values.persistence.cache.storageClass }}
  storageClassName: ""
  {{- else }}
  storageClassName: {{ .Values.persistence.cache.storageClass | quote }}
  {{- end }}
  {{- end }}
{{- end }}
