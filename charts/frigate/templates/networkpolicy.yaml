{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "frigate.fullname" . }}
  labels:
    {{- include "frigate.labels" . | nindent 4 }}
spec:
  # the Frigate pod
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "frigate.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  {{- $rules := list }}
  {{- if .Values.networkPolicy.allowSameNamespace }}
  {{- $rules = append $rules (dict "from" (list (dict "podSelector" dict))) }}
  {{- end }}
  {{- $rules = concat $rules (.Values.networkPolicy.ingress | default list) }}
  ingress:
  {{- if $rules }}
    {{- toYaml $rules | nindent 4 }}
  {{- else }} []
  {{- end }}
{{- end }}
