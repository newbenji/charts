{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "music-assistant.fullname" . }}
  labels:
    {{- include "music-assistant.labels" . | nindent 4 }}
spec:
  # the Music Assistant pod
  podSelector:
    matchLabels:
      {{- include "music-assistant.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- $rules := list }}
  {{- if .Values.networkPolicy.allowSameNamespace }}
  {{- $rules = append $rules (dict "from" (list (dict "podSelector" dict))) }}
  {{- end }}
  {{- $rules = concat $rules (.Values.networkPolicy.ingress | default list) }}
  ingress:
  {{- if $rules }}
    {{- toYaml $rules | nindent 4 }}
  {{- else }} []
  {{- end }}
{{- end }}
