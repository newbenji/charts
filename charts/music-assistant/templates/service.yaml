apiVersion: v1
kind: Service
metadata:
  name: {{ include "music-assistant.fullname" . }}
  labels:
    {{- include "music-assistant.labels" . | nindent 4 }}
  {{- with include "music-assistant.annotations" (dict "ctx" $ "extra" .Values.service.annotations) }}
  {{- . | trim | nindent 2 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.exposeStreamPort }}
    - port: {{ .Values.ports.stream }}
      targetPort: stream
      protocol: TCP
      name: stream
    {{- end }}
  selector:
    {{- include "music-assistant.selectorLabels" . | nindent 4 }}
